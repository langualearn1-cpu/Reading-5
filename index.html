    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fdf3e7 0%, #f5e6d3 50%, #efe0cc 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .worksheet-font {
            font-family: 'Fredoka', 'Nunito', 'Comic Neue', sans-serif;
            letter-spacing: 0.01em;
        }

        .arabic-font {
            font-family: 'Cairo', sans-serif;
        }

        /* Poster Outer Frame matching the beige patterned page */
        .poster-frame {
            background-color: #f6eadb;
            background-image:
                radial-gradient(#e6d2b8 1.5px, transparent 1.5px),
                radial-gradient(#ebd8c0 1.5px, #f6eadb 1.5px);
            background-size: 44px 44px;
            background-position: 0 0, 22px 22px;
            box-shadow: 0 20px 60px rgba(78, 52, 46, 0.22), 0 0 0 6px rgba(255, 255, 255, 0.95);
        }

        /* Inner white rounded sheet */
        .inner-sheet {
            background-color: #fcf9f2;
            border-radius: 26px;
            box-shadow: inset 0 0 0 2px #eddcc4;
        }

        /* Section 1 Boxes (Singular & Plural boxes) */
        .word-card-box {
            background-color: #f3e4d0;
            border: 2.5px solid #4a332a;
            border-radius: 14px;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .word-card-box.row-active {
            background-color: #fff9c4;
            box-shadow: 0 0 0 2.5px #f59e0b;
        }

        /* Static Word Highlight (100% Fixed - NO scaling, NO jumping) */
        .eng-read-target {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 9px;
            cursor: pointer;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .eng-read-target:hover {
            background-color: rgba(253, 224, 71, 0.45);
        }

        .eng-read-target.word-active {
            background-color: #ffe082 !important;
            box-shadow: 0 0 0 2.5px #ff8f00 !important;
        }

        /* Dotted Answer Slot for Rows 3 to 8 */
        .plural-blank-slot {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 112px;
            padding: 1px 8px;
            border-radius: 9px;
            cursor: pointer;
        }

        .plural-blank-slot .dots-line {
            color: #3e2723;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .plural-blank-slot .plural-answer-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #1d4ed8;
            background-color: #f3e4d0;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
        }

        .show-all-answers .plural-blank-slot .plural-answer-text,
        .plural-blank-slot.revealed .plural-answer-text {
            opacity: 1;
        }

        .plural-blank-slot.word-active,
        .plural-blank-slot.word-active .plural-answer-text {
            background-color: #ffe082 !important;
            box-shadow: 0 0 0 2.5px #ff8f00 !important;
        }

        /* Choose Card Styling */
        .choose-card {
            background-color: #f3e4d0;
            border: 2.5px solid #4a332a;
            border-radius: 16px;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        /* Correct option badge when answers are shown */
        .show-all-answers .choice-correct,
        .choice-correct.selected-choice {
            color: #15803d;
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
        }

        /* Floating Pointing Finger (100% Static under the word, NEVER sliding on letters) */
        #reading-finger {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.15s ease;
            transform: translate(-50%, 0);
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.32));
        }

        #reading-finger.visible {
            opacity: 1;
        }

        #reading-finger.reading-active {
            transform: translate(-50%, 0);
        }

        .finger-ripple {
            position: absolute;
            top: 6px;
            left: 50%;
            width: 22px;
            height: 22px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 3px solid #ff2e7e;
            background: rgba(255, 230, 0, 0.45);
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 99px; }

                        </div>
                    </div>

                    <!-- Coral-Red Right Arrow -->
                    <div onclick="playFullConversionRow(${row.id})" class="cursor-pointer px-0.5 flex items-center justify-center hover:scale-105 transition" title="قراءة المفرد والجمع معاً">
                        <svg width="38" height="28" viewBox="0 0 42 30" fill="none" class="w-8 sm:w-10 h-auto">
                            <path d="M3 11H24V4L39 15L24 26V19H3V11Z" fill="#e56b55" stroke="#4a332a" stroke-width="2.4" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <!-- Right Box: Plural -->
                    <div id="box-plur-${row.id}" onclick="handleBlankPluralClick(event, ${row.id}, '${row.plural}', document.getElementById('eng-row-plur-${row.id}'))" class="word-card-box px-2.5 sm:px-4 py-1.5 min-h-[58px] flex items-center justify-between gap-1 cursor-pointer">
                        ${pluralWordSlotHTML}
                        <div class="flex items-center justify-end -space-x-1 sm:space-x-0.5">
                            ${pluralIconsHTML}
                        </div>
                    </div>
                `;
                rowsContainer.appendChild(rowEl);
            });

            // 2. Render 6 Choose Cards
            const chooseContainer = document.getElementById('choose-grid-container');
            chooseContainer.innerHTML = '';

            CHOOSE_CARDS.forEach(card => {
                const iconsHTML = card.icons
                    .map(ic => getIllustrationSVG(ic, card.icons.length === 1 ? "w-16 h-16" : "w-12 h-14 sm:w-14 sm:h-15"))
                    .join('');

                const isOpt1Correct = card.opt1 === card.correct;
                const isOpt2Correct = card.opt2 === card.correct;

                const cardEl = document.createElement('div');
                cardEl.className = "choose-card px-2.5 py-2.5 flex flex-col items-center justify-between gap-2";
                cardEl.innerHTML = `
                    <!-- Illustration Area -->
                    <div onclick="playChooseCardPair(${card.id})" class="w-full min-h-[64px] flex items-center justify-center gap-1 sm:gap-2 cursor-pointer" title="استمع للخيارين">
                        ${iconsHTML}
                    </div>

                    <!-- Word Choices: (opt1 - opt2) -->
                    <div class="worksheet-font font-black text-xl sm:text-[24px] text-[#231815] flex items-center justify-center flex-wrap leading-tight">
                        <span>(</span>
                        <span id="eng-choose-${card.id}-opt1"
                              onclick="handleChoiceClick(event, '${card.opt1}', ${isOpt1Correct}, this)"
                              class="eng-read-target ${isOpt1Correct ? 'choice-correct' : ''}">
                            ${card.opt1}
                        </span>
                        <span class="mx-0.5">-</span>
                        <span id="eng-choose-${card.id}-opt2"
                              onclick="handleChoiceClick(event, '${card.opt2}', ${isOpt2Correct}, this)"
                              class="eng-read-target ${isOpt2Correct ? 'choice-correct' : ''}">
                            ${card.opt2}
                        </span>
                        <span>)</span>
                    </div>
                `;
                chooseContainer.appendChild(cardEl);
            });
        }

        // ==================== ORDERED STEPS FOR FULL LESSON AUTO-PLAY ====================
        function buildSequentialSteps() {
            const steps = [
                { elId: 'eng-header-title', spoken: 'Top Grammar 1' },
                { elId: 'eng-header-sub',   spoken: 'Singular and Plural' },
                { elId: 'eng-sec1-title',   spoken: 'Change into plural' }
            ];

            PLURAL_ROWS.forEach(r => {
                steps.push({ elId: `eng-row-sing-${r.id}`, spoken: r.singular });
                steps.push({ elId: `eng-row-plur-${r.id}`, spoken: r.plural });
            });

            steps.push({ elId: 'eng-sec2-title', spoken: 'Choose the correct word' });

            CHOOSE_CARDS.forEach(c => {
                steps.push({ elId: `eng-choose-${c.id}-opt1`, spoken: c.opt1 });
                steps.push({ elId: `eng-choose-${c.id}-opt2`, spoken: c.opt2 });
            });

            return steps;
        }

        // ==================== STATE & STEADY POINTING FINGER ====================
        let currentFingerTargetEl = null;
        let isAutoPlaying = false;
        let autoPlayTimeout = null;
        let stepTimers = [];
        let showAllAnswers = true;

        let speechRates = [
            { value: 0.84, label: "السرعة: تعليمي واضح" },
            { value: 0.68, label: "السرعة: بطيء للتأسيس" },
            { value: 0.98, label: "السرعة: طبيعي" }
        ];
        let currentSpeedIdx = 0;
        let repeatTwice = false;

        /**
         * Places the pointing finger steadily right underneath the target whole word element
         * WITHOUT moving across letters or bobbing.
         */
        function placeFingerUnderElement(el) {
            const finger = document.getElementById('reading-finger');
            if (!el || !finger) return;

            currentFingerTargetEl = el;
            const rect = el.getBoundingClientRect();
            const targetX = rect.left + (rect.width / 2);
            const targetY = rect.bottom - 3;

            finger.style.left = `${targetX}px`;
            finger.style.top = `${targetY}px`;
            finger.classList.add('visible', 'reading-active');
        }

        function clearActiveHighlights() {
            document.querySelectorAll('.eng-read-target, .plural-blank-slot').forEach(el => el.classList.remove('word-active'));
        }

        function clearStepTimers() {
            stepTimers.forEach(t => clearTimeout(t));
            stepTimers = [];
        }

        window.addEventListener('scroll', () => {
            if (currentFingerTargetEl) placeFingerUnderElement(currentFingerTargetEl);
        }, { passive: true });
        window.addEventListener('resize', () => {
            if (currentFingerTargetEl) placeFingerUnderElement(currentFingerTargetEl);
        });

        // ==================== EDUCATIONAL NATURAL VOICE ENGINE ====================
        let preferredEnglishVoice = null;
        let availableEnglishVoices = [];

        function scoreVoiceQuality(v) {
            let score = 0;
            const name = v.name.toLowerCase();
            const lang = v.lang.toLowerCase();

            if (!lang.startsWith('en')) return -999;

            if (lang === 'en-us' || lang === 'en_us') score += 35;
            else if (lang === 'en-gb' || lang === 'en_gb') score += 30;
            else score += 15;

            if (name.includes('natural')) score += 60;
            if (name.includes('online')) score += 40;
            if (name.includes('neural')) score += 50;
            if (name.includes('premium') || name.includes('enhanced')) score += 45;

            const topTeacherVoices = [
                'ava', 'aria', 'jenny', 'ana', 'sonia', 'libby', 'ryan', 'guy',
                'google us english', 'google uk english female', 'samantha',
                'allison', 'karen', 'daniel', 'moira', 'serena', 'zira'
            ];
            for (let i = 0; i < topTeacherVoices.length; i++) {
                if (name.includes(topTeacherVoices[i])) {
                    score += (35 - i);
                    break;
                }
            }

            if (name.includes('compact') || name.includes('espeak')) score -= 50;
            return score;
        }

        function loadPreferredEnglishVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;

            availableEnglishVoices = voices
                .filter(v => v.lang && v.lang.toLowerCase().startsWith('en'))
                .sort((a, b) => scoreVoiceQuality(b) - scoreVoiceQuality(a));

            if (availableEnglishVoices.length > 0) {
                preferredEnglishVoice = availableEnglishVoices[0];
            }

            const selectEl = document.getElementById('voice-select');
            if (selectEl && availableEnglishVoices.length > 0) {
                const currentVal = selectEl.value;
                selectEl.innerHTML = '';

                availableEnglishVoices.slice(0, 12).forEach((v, idx) => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    const cleanLabel = v.name
                        .replace(/Microsoft |Google |Apple /g, '')
                        .replace(/Online \(Natural\) - /g, '🌟 ')
                        .replace(/English /g, '');
                    opt.textContent = idx === 0 ? `🌟 ${cleanLabel} (أفضل صوت تعليمي)` : `🎙️ ${cleanLabel}`;
                    selectEl.appendChild(opt);
                });

                if (currentVal && currentVal !== 'auto' && availableEnglishVoices.some(v => v.name === currentVal)) {
                    selectEl.value = currentVal;
                    preferredEnglishVoice = availableEnglishVoices.find(v => v.name === currentVal);
                } else if (preferredEnglishVoice) {
                    selectEl.value = preferredEnglishVoice.name;
                }
            }
        }

        function handleVoiceChange(voiceName) {
            const found = availableEnglishVoices.find(v => v.name === voiceName);
            if (found) {
                preferredEnglishVoice = found;
                speakStaticEnglish('Cat', document.getElementById('eng-row-sing-1'));
            }
        }

        if ('speechSynthesis' in window) {
            loadPreferredEnglishVoice();
            window.speechSynthesis.onvoiceschanged = loadPreferredEnglishVoice;
        }

        /**
         * Core English TTS Helper: Speaks English text while keeping the highlight
         * and pointing finger 100% STATIC under `targetEl`.
         */
        function speakStaticEnglish(textToSpeak, targetEl, onEndCallback) {
            clearStepTimers();
            clearActiveHighlights();

            if (targetEl) {
                targetEl.classList.add('word-active');
                placeFingerUnderElement(targetEl);
            }

            const playOnce = (doneOnce) => {
                if (!('speechSynthesis' in window)) {
                    stepTimers.push(setTimeout(() => { if (doneOnce) doneOnce(); }, 900));
                    return;
                }

                const utter = new SpeechSynthesisUtterance(textToSpeak);
                utter.lang = preferredEnglishVoice ? preferredEnglishVoice.lang : 'en-US';
                if (preferredEnglishVoice) utter.voice = preferredEnglishVoice;
                utter.rate = speechRates[currentSpeedIdx].value;
                utter.pitch = 1.04;

                utter.onend = () => { if (doneOnce) doneOnce(); };
                utter.onerror = () => { if (doneOnce) doneOnce(); };

                window.speechSynthesis.speak(utter);
            };

            playOnce(() => {
                if (repeatTwice) {
                    stepTimers.push(setTimeout(() => {
                        playOnce(() => {
                            if (onEndCallback) onEndCallback();
                        });
                    }, 360));
                } else {
                    if (onEndCallback) onEndCallback();
                }
            });
        }

        // ==================== INTERACTION HANDLERS ====================
        function handleWordClick(event, wordText, targetEl) {
            event.stopPropagation();
            if (isAutoPlaying) stopAutoPlay();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            speakStaticEnglish(wordText, targetEl);
        }

        function handleBlankPluralClick(event, rowId, pluralWord, targetEl) {
            event.stopPropagation();
            if (isAutoPlaying) stopAutoPlay();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (targetEl) targetEl.classList.add('revealed');
            speakStaticEnglish(pluralWord, targetEl);
        }

        function handleChoiceClick(event, wordText, isCorrect, targetEl) {
            event.stopPropagation();
            if (isAutoPlaying) stopAutoPlay();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (isCorrect && targetEl) {
                targetEl.classList.add('selected-choice');
            }
            speakStaticEnglish(wordText, targetEl);
        }

        function playFullConversionRow(rowId) {
            if (isAutoPlaying) stopAutoPlay();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const row = PLURAL_ROWS.find(r => r.id === rowId);
            if (!row) return;

            const singEl = document.getElementById(`eng-row-sing-${row.id}`);
            const plurEl = document.getElementById(`eng-row-plur-${row.id}`);
            if (plurEl) plurEl.classList.add('revealed');

            speakStaticEnglish(row.singular, singEl, () => {
                stepTimers.push(setTimeout(() => {
                    speakStaticEnglish(row.plural, plurEl);
                }, 320));
            });
        }

        function playChooseCardPair(cardId) {
            if (isAutoPlaying) stopAutoPlay();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const card = CHOOSE_CARDS.find(c => c.id === cardId);
            if (!card) return;

            const el1 = document.getElementById(`eng-choose-${card.id}-opt1`);
            const el2 = document.getElementById(`eng-choose-${card.id}-opt2`);

            speakStaticEnglish(card.opt1, el1, () => {
                stepTimers.push(setTimeout(() => {
                    speakStaticEnglish(card.opt2, el2);
                }, 320));
            });
        }

        // ==================== SEQUENTIAL AUTO-PLAY ====================
        function toggleAutoPlay() {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                const allSteps = buildSequentialSteps();
                startStepsSequence(allSteps, 0);
            }
        }

        function playChooseSectionOnly() {
            if (isAutoPlaying) stopAutoPlay();
            const allSteps = buildSequentialSteps();
            const chooseStartIdx = allSteps.findIndex(s => s.elId === 'eng-sec2-title');
            startStepsSequence(allSteps, chooseStartIdx >= 0 ? chooseStartIdx : 0);
        }

        function startStepsSequence(stepsList, startIndex) {
            isAutoPlaying = true;
            updateAutoPlayButtonUI();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            let idx = startIndex;

            function nextStep() {
                if (!isAutoPlaying || idx >= stepsList.length) {
                    stopAutoPlay();
                    return;
                }

                const step = stepsList[idx];
                const el = document.getElementById(step.elId);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    if (el.classList.contains('plural-blank-slot')) {
                        el.classList.add('revealed');
                    }
                }

                autoPlayTimeout = setTimeout(() => {
                    if (!isAutoPlaying) return;
                    speakStaticEnglish(step.spoken, el, () => {
                        if (!isAutoPlaying) return;
                        idx++;
                        autoPlayTimeout = setTimeout(nextStep, 450);
                    });
                }, 140);
            }

            nextStep();
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearStepTimers();
            if (autoPlayTimeout) {
                clearTimeout(autoPlayTimeout);
                autoPlayTimeout = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            updateAutoPlayButtonUI();
        }

        function updateAutoPlayButtonUI() {
            const icon = document.getElementById('icon-auto-play');
            const text = document.getElementById('text-auto-play');

            if (isAutoPlaying) {
                icon.className = 'fa-solid fa-stop';
                text.textContent = 'إيقاف القراءة الآلية';
            } else {
                icon.className = 'fa-solid fa-play';
                text.textContent = 'قراءة الدرس كاملاً بالترتيب';
            }
        }

        // ==================== TOOLBAR CONTROLS ====================
        function toggleShowAllAnswers() {
            showAllAnswers = !showAllAnswers;
            const container = document.getElementById('poster-container');
            const btn = document.getElementById('btn-answers');
            const label = document.getElementById('answers-label');

            container.classList.toggle('show-all-answers', showAllAnswers);
            if (!showAllAnswers) {
                document.querySelectorAll('.plural-blank-slot').forEach(el => el.classList.remove('revealed'));
                document.querySelectorAll('.selected-choice').forEach(el => el.classList.remove('selected-choice'));
            }

            if (showAllAnswers) {
                label.textContent = 'الإجابات معروضة';
                btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 border border-emerald-600 shadow-sm transition text-xs sm:text-sm';
            } else {
                label.textContent = 'إظهار الحل';
                btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-xl font-bold text-emerald-900 bg-emerald-100 hover:bg-emerald-200 border border-emerald-300 transition text-xs sm:text-sm';
            }
        }

        function cycleSpeechSpeed() {
            currentSpeedIdx = (currentSpeedIdx + 1) % speechRates.length;
            document.getElementById('speed-label').textContent = speechRates[currentSpeedIdx].label;
        }

        function toggleRepeatWord() {
            repeatTwice = !repeatTwice;
            const label = document.getElementById('repeat-label');
            label.textContent = repeatTwice ? 'النطق: مرتان للحفظ' : 'النطق: مرة واحدة';
        }

        // Initialize on Window Load
        window.onload = function() {
            renderPosterContent();
        };
    </script>
</body>
